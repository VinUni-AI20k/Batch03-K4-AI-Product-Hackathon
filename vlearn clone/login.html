<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đăng nhập — VLearn</title>
  <meta name="description" content="Đăng nhập vào VLearn — Nền tảng học thích ứng cho VinUni AI Thực Chiến." />
  <link rel="icon" href="brand/vinuni-mark.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <!-- Back to Home -->
  <a class="back-home" href="index.html">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
    Trang chủ
  </a>

  <!-- Theme Toggle -->
  <div class="login-toggles">
    <button type="button" class="login-toggle-btn" id="login-theme-toggle" aria-label="Chuyển giao diện tối" title="Chuyển giao diện tối">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-moon"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-sun" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
    </button>
  </div>

  <!-- Login Content -->
  <div class="login-page">
    <a class="login-logo" href="index.html">
      <img src="brand/vinuni-mark.svg" alt="VLearn" width="44" height="44" />
      <span class="login-wordmark"><span class="v-letter">V</span>Learn</span>
    </a>
    <p class="login-subtitle">Nền tảng học thích ứng · VinUni AI Thực Chiến</p>

    <div class="login-card">
      <h2>Đăng nhập</h2>
      <p class="login-desc">Sử dụng tài khoản VinUni AI Thực Chiến đã được cấp để đăng nhập.</p>

      <!-- Error -->
      <div class="login-error" id="login-error">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
        <span id="error-text">Email hoặc mật khẩu không đúng.</span>
      </div>

      <form class="login-form" id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@vinuni.edu.vn" autocomplete="email" required />
        </div>
        <div class="form-group">
          <label for="password">Mật khẩu</label>
          <div class="password-wrapper">
            <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" autocomplete="current-password" required />
            <button type="button" class="password-toggle" id="password-toggle" aria-label="Hiện/ẩn mật khẩu">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-eye"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-eye-off" style="display:none"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="login-submit" id="login-btn">
          <span class="btn-text">Đăng nhập</span>
          <div class="spinner"></div>
          <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-text" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
      </form>
    </div>

    <div class="login-footer">
      <a href="index.html">← Quay về trang chủ</a>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
