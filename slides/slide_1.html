<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VLearn Quiz AI — Tạo Quiz Từ Slide, Tài Liệu</title>
  
  <!-- Fonts: Plus Jakarta Sans (Headings) + Be Vietnam Pro (Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-slate: #0f172a;
      --text-white: #ffffff;
      --text-emerald: #34d399;
      --text-muted: #94a3b8;
      --text-subtle: #cbd5e1;
      --border-subtle: rgba(255, 255, 255, 0.12);
      
      --font-heading: 'Plus Jakarta Sans', -apple-system, sans-serif;
      --font-body: 'Be Vietnam Pro', -apple-system, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-slate);
      color: var(--text-white);
      font-family: var(--font-body);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .slide {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      padding: clamp(3.5rem, 7vw, 6rem);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: radial-gradient(circle at 82% 18%, #1e293b 0%, transparent 60%),
                  radial-gradient(circle at 15% 85%, #064e3b 0%, transparent 45%),
                  var(--bg-slate);
    }

    .hero {
      max-width: 1050px;
      margin: auto 0;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .main-title {
      font-family: var(--font-heading);
      font-size: clamp(3.5rem, 7.5vw, 5.8rem);
      font-weight: 900;
      line-height: 1.22;
      letter-spacing: -0.03em;
      color: var(--text-white);
    }

    .highlight-emerald {
      color: var(--text-emerald);
    }

    .subtitle {
      font-size: clamp(1.35rem, 2.3vw, 1.8rem);
      color: var(--text-subtle);
      font-weight: 400;
      line-height: 1.65;
      max-width: 920px;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border-subtle);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    .nav-link {
      color: var(--text-emerald);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: opacity 0.2s;
    }

    .nav-link:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="slide">
    <!-- Hero Title -->
    <div class="hero">
      <h1 class="main-title">
        VLearn Quiz AI — <span class="highlight-emerald">Tạo Quiz Từ Slide, Tài Liệu</span>
      </h1>
      <p class="subtitle">
        Tự động chuyển đổi slide bài giảng PDF thành bộ câu hỏi trắc nghiệm tình huống thực tế giúp học viên kiểm tra khả năng vận hành kiến thức ngay sau giờ học.
      </p>
    </div>

    <!-- Footer -->
    <div class="footer">
      <span>SLIDE 01 / 06</span>
      <a href="slide_2.html" class="nav-link">TIẾP THEO: KHẢO SÁT ➔</a>
    </div>
  </div>

  <script>
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        window.location.href = 'slide_2.html';
      }
    });
  </script>
</body>
</html>
