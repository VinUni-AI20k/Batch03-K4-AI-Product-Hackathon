[project]
name = "learning-agent"
version = "0.1.0"
description = "Agent học tập cho học viên: Discord gateway + Obsidian-style vault + RAG, tự build (tham khảo kiến trúc Hermes Agent & basic-memory)"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",              # client OpenAI-compatible: OpenAI / OpenRouter / Nous Portal / Ollama
    "discord.py>=2.4",
    "python-telegram-bot>=21.0",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    "chromadb>=0.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ingest = [
    "docling>=2.0",              # slide/PDF/PPTX -> markdown
    "python-pptx>=1.0",          # speaker notes
    "faster-whisper>=1.0",       # ASR (dùng bản PhoWhisper-ct2 cho tiếng Việt)
    "imagehash>=4.3",            # dHash keyframe video
    "Pillow>=10.0",
    "rapidfuzz>=3.0",            # match OCR keyframe <-> trang deck
]
voyage = ["voyageai>=0.3"]
dev = ["pytest>=8.0"]

[project.scripts]
learning-agent = "learning_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learning_agent"]
