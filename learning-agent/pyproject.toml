[project]
name = "learning-agent"
version = "0.1.0"
description = "Vlearn Agent — trợ giảng AI cá nhân: Discord/Telegram gateway + vault markdown (Obsidian-compatible) + RAG, skills, memory 3 tầng. Tự build bởi đội AIECOS/Vlearn."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",              # client OpenAI-compatible: OpenAI / OpenRouter / Nous Portal / Ollama
    "discord.py>=2.4",
    "python-telegram-bot>=21.0",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    "chromadb>=0.5",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "ddgs>=6.0",                  # web search cho tool nghiên cứu (Reddit/GitHub dùng stdlib)
]

[project.optional-dependencies]
ingest = [
    "docling>=2.0",              # slide/PDF/PPTX -> markdown
    "python-pptx>=1.0",          # speaker notes
    "faster-whisper>=1.0",       # ASR (dùng bản PhoWhisper-ct2 cho tiếng Việt)
    "imagehash>=4.3",            # dHash keyframe video
    "Pillow>=10.0",
    "rapidfuzz>=3.0",            # match OCR keyframe <-> trang deck
]
voyage = ["voyageai>=0.3"]
dev = ["pytest>=8.0"]

[project.scripts]
learning-agent = "learning_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learning_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["data", ".venv", "vault", "source_mirror"]
