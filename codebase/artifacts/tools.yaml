# Khai báo tool cho agent (giảng viên hỏi tự do bằng tiếng Việt, agent tự chọn tool).
# Đổi tên tool phải sync đồng bộ: file này -> tools/__init__.py (TOOL_FUNCTIONS)
# -> thư mục tools/<tool_name>/ -> README.md.
tools:
  - name: get_topic_digest
    description: >-
      Lấy top-N chủ đề (chương bài giảng) mà học viên hỏi nhiều/chưa hiểu nhất trong MỘT
      ngày cụ thể, kèm số lượng câu hỏi, tỉ lệ tutor không tìm được nội dung để trả lời
      (tutor_bo_tay_rate), và ví dụ câu hỏi thật đã cắt ngắn.
      Dùng khi: giảng viên hỏi tổng quan "hôm nay/hôm qua/ngày X học viên vướng chủ đề gì",
      "top N chủ đề tuần này".
      KHÔNG dùng khi: giảng viên hỏi đào sâu một chủ đề cụ thể đã biết chapter_id (dùng
      get_topic_examples), hoặc hỏi ngày nào có dữ liệu (dùng list_available_dates trước).
    parameters:
      type: object
      properties:
        date: {type: string, default: "", description: "Ngày dạng YYYY-MM-DD. Rỗng = ngày mới nhất có dữ liệu."}
        top_n: {type: integer, default: 5, description: "Số chủ đề muốn lấy"}
      required: []

  - name: get_topic_examples
    description: >-
      Lấy thêm ví dụ câu hỏi thật của học viên cho MỘT chương cụ thể.
      Dùng khi: giảng viên đã thấy digest và muốn đào sâu vào 1 chủ đề, ví dụ "cho ví dụ
      chủ đề số 2", "chương đó học viên hỏi cụ thể gì".
      KHÔNG dùng khi: chưa có chapter_id từ một lần gọi get_topic_digest trước đó — không
      được tự đoán chapter_id.
    parameters:
      type: object
      properties:
        chapter_id: {type: string, default: "", description: "chapter_id lấy từ kết quả get_topic_digest, ví dụ DAY_02_CH_07"}
        date: {type: string, default: "", description: "Ngày dạng YYYY-MM-DD. Rỗng = ngày mới nhất có dữ liệu."}
        limit: {type: integer, default: 5, description: "Số ví dụ tối đa"}
      required: [chapter_id]

  - name: list_available_dates
    description: >-
      Liệt kê các ngày đã có dữ liệu chatlog đã được xử lý, kèm tổng số turn mỗi ngày.
      Dùng khi: cần kiểm tra trước khi trả lời về một ngày cụ thể, tránh bịa ra ngày
      không có dữ liệu; hoặc giảng viên hỏi thẳng "dữ liệu có đến ngày nào".
    parameters:
      type: object
      properties: {}
      required: []

  - name: compare_periods
    description: >-
      So sánh các chỉ số giữa hai giai đoạn thời gian, áp dụng cho toàn bộ các chủ đề hoặc lọc theo một chủ đề cụ thể.
      Dùng khi: giảng viên muốn so sánh số liệu (như số lượng câu hỏi, tỷ lệ tutor không trả lời được) giữa hai khoảng thời gian (ví dụ tuần này so với tuần trước) hoặc so sánh một chủ đề cụ thể qua thời gian.
    parameters:
      type: object
      properties:
        period_a:
          type: object
          properties:
            from: {type: string, description: "Ngày bắt đầu giai đoạn A, định dạng YYYY-MM-DD"}
            to: {type: string, description: "Ngày kết thúc giai đoạn A, định dạng YYYY-MM-DD"}
          required: ["from", "to"]
        period_b:
          type: object
          properties:
            from: {type: string, description: "Ngày bắt đầu giai đoạn B, định dạng YYYY-MM-DD"}
            to: {type: string, description: "Ngày kết thúc giai đoạn B, định dạng YYYY-MM-DD"}
          required: ["from", "to"]
        metric: {type: string, description: "Chỉ số cần so sánh: 'count' (tổng câu hỏi), 'tutor_bo_tay_rate' (tỉ lệ tutor không trả lời được), 'down_ratings' (số lượt đánh giá thấp)"}
        topic_id: {type: string, description: "Mã chủ đề (chapter_id) để lọc, ví dụ DAY_02_CH_07. Nếu bỏ trống, so sánh tổng hợp trên toàn bộ các chủ đề."}
      required: ["period_a", "period_b", "metric"]

  - name: search_by_keyword
    description: >-
      Tìm kiếm văn bản tự do trên tất cả câu hỏi của học viên và tên chủ đề bài giảng (chapter_title). 
      Dùng khi: giảng viên muốn tìm kiếm các câu hỏi liên quan đến một từ khóa cụ thể hoặc kiểm tra xem một thuật ngữ nào đó có được sinh viên hỏi hay không.
    parameters:
      type: object
      properties:
        keyword: {type: string, description: "Từ khóa cần tìm kiếm (không phân biệt chữ hoa thường hay dấu câu)."}
        time_range:
          type: object
          properties:
            from: {type: string, description: "Từ ngày, định dạng YYYY-MM-DD"}
            to: {type: string, description: "Đến ngày, định dạng YYYY-MM-DD"}
          description: "Khoảng thời gian muốn tìm kiếm, nếu có."
        limit: {type: integer, default: 20, description: "Số lượng kết quả trả về tối đa."}
      required: ["keyword"]
