[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gmail-mcp-client"
version = "0.1.0"
description = "A small Python client for Gmail MCP servers"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "mcp>=1.28,<2", "pydantic>=2.0", "python-dotenv>=1.0"]

[project.scripts]
gmail-mcp = "gmail_mcp_client.cli:main"

[tool.setuptools.packages.find]
include = ["gmail_mcp_client*"]
